[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-capabilities"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "playwright>=1.50,<2", "openai>=1.60,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[project.scripts]
bank-demo = "bank_automation.server:main"
automation = "bank_automation.cli:main"

[tool.setuptools.package-data]
bank_automation = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["bank_automation*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
